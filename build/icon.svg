<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="0.5" stop-color="#121216"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#8e8e98"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#drop)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <path d="M337.1 676.7 A222 222 0 1 1 731.8 509.1" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="110" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="700.3" cy="657.6" r="120" fill="url(#spark)" opacity="0.35"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <path d="M337.1 676.7 A222 222 0 1 1 731.8 509.1" fill="none" stroke="url(#arc)" stroke-width="82" stroke-linecap="round"/>
  <circle cx="700.3" cy="657.6" r="41" fill="#ffffff"/>
</svg>

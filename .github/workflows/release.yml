name: Release

# Every push to main builds macOS, Windows and Linux installers and publishes
# them to one GitHub Release, v1.0.<run number>. File names carry no version,
# so https://github.com/xohnny1337/myarc/releases/latest/download/<file>
# always points at the newest build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time; a newer push waits instead of racing the older one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unique version per push, so each push becomes its own release.
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
        shell: bash

      # macOS: sign with the Developer ID certificate and notarize with the
      # App Store Connect API key. Without those secrets the build still
      # works, ad-hoc signed and not notarized (Gatekeeper asks users to
      # confirm on first open).
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::Signing secrets missing: building ad-hoc signed, not notarized."
            echo "BUILDER_ARGS=-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # Apple's Developer ID intermediate certificate, so codesign can
          # chain the certificate up to Apple's root.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security add-certificates -k ~/Library/Keychains/login.keychain-db "$RUNNER_TEMP/DeveloperIDG2CA.cer" || true
          # Notarization reads the API key from a file.
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        shell: bash
        run: npm run dist -- $BUILDER_ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only the macOS job signs with the Apple certificate; elsewhere
          # these are empty and ignored.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
